[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-evoharness"
version = "0.1.0"
description = "Evolve the harness of a real-time LLM decision agent: Decision Interface, executor and playbook, admitted only on measured evidence."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "httpx>=0.27", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/RunRiotComeOn/realtime-evoharness"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evoharness = "evoharness.cli:main"

[tool.setuptools]
packages = ["evoharness", "evoharness.prompts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
